<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriTrade - Login</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7f4;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            color: #2f7d4a;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7a857e;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-login {
            width: 100%;
            background: #2f7d4a;
            border: none;
            padding: 11px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #25663c;
        }

        #loginError {
            display: none;
            margin-top: 15px;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            AgriTrade
        </div>

        <div class="subtitle">
            Login to continue
        </div>

        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary btn-login"
            >
                Login
            </button>

            <div
                id="loginError"
                class="alert alert-danger"
            ></div>

        </form>

    </div>


    <script>

        const loginForm =
            document.getElementById('loginForm');

        const loginError =
            document.getElementById('loginError');


        loginForm.addEventListener(
            'submit',
            async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById(
                        'username'
                    ).value.trim();

                const password =
                    document.getElementById(
                        'password'
                    ).value;


                try {

                    const response = await fetch(
    'https://marvelous-trust-production-1570.up.railway.app/api/login',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body: JSON.stringify({
                                    username,
                                    password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        loginError.textContent =
                            data.error ||
                            'Login failed';

                        loginError.style.display =
                            'block';

                        return;
                    }

                    // Login successful
                    window.location.href = '/';


                } catch (error) {

                    console.error(error);

                    loginError.textContent =
                        'Unable to connect to server';

                    loginError.style.display =
                        'block';
                }

            }
        );

    </script>

</body>

</html>
